{% load static %}<!DOCTYPE html>
<html lang="{{ request.LANG|default:'ru' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Вход в систему{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="auth">
  <main class="auth-card">
    <div class="auth-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-5 9 5-9 5-9-5z"/><path d="M7 11.5V16c0 1.2 2.2 2.5 5 2.5s5-1.3 5-2.5v-4.5"/></svg>
      <span>Наша школа</span>
    </div>
    {% block body %}{% endblock %}
    <form method="post" action="{% url 'set_lang' %}" class="lang">{% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      <select name="lang" onchange="this.form.submit()" aria-label="Language">
        <option value="ru" {% if request.LANG != 'ky' %}selected{% endif %}>Русский</option>
        <option value="ky" {% if request.LANG == 'ky' %}selected{% endif %}>Кыргызча</option>
      </select></form>
    <p class="auth-foot">© 2026 Наша школа</p>
  </main>
</body>
</html>
