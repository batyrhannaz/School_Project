{% extends "base.html" %}
{% block title %}Новое объявление{% endblock %}
{% block content %}
<section class="wrap narrow">
  <h1>Новое объявление</h1>
  <form method="post" class="form">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn">Опубликовать</button>
  </form>
  <p class="muted">Ученики класса и их родители получат уведомление.</p>
  <p><a href="{% url 'announcements' %}">← К объявлениям</a></p>
</section>
{% endblock %}
