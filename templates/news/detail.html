{% extends "base.html" %}
{% block title %}{{ item.title }}{% endblock %}
{% block content %}
<article class="wrap narrow">
  <small>{{ item.created|date:"d.m.Y" }}</small>
  <h1>{{ item.title }}</h1>
  {% if item.image %}<img class="wide-img" src="{{ item.image.url }}" alt="">{% endif %}
  <p class="prose">{{ item.text|linebreaksbr }}</p>
  <a href="{% url 'news_list' %}">Все новости</a>
</article>
{% endblock %}
